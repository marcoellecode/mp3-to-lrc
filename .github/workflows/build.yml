# Costruisce l'eseguibile Windows con PyInstaller (vedi BUILD.md).
#
# - Push di un tag "v*" (es. v1.0.0): build + autotest + Release pubblica con lo zip.
# - Avvio manuale (scheda Actions > "Build Windows" > Run workflow): build +
#   autotest, lo zip resta scaricabile come artifact per 7 giorni.
name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Percorsi di lavoro
        run: |
          "VENV=$env:RUNNER_TEMP\venv" >> $env:GITHUB_ENV
          "FFMPEG_ROOT=$env:RUNNER_TEMP\ffmpeg" >> $env:GITHUB_ENV
          "DIST=$env:RUNNER_TEMP\dist" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Dipendenze (versioni esatte di requirements-lock.txt, torch CPU)
        run: |
          python -m venv $env:VENV
          & "$env:VENV\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:VENV\Scripts\python.exe" -m pip install -r requirements-lock.txt

      # Build LGPL di FFmpeg (BtbN): si puo' ridistribuire insieme all'app
      # senza vincoli sulla licenza del progetto, a differenza delle build GPL.
      - name: FFmpeg (build LGPL)
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-x"
          Move-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-x" -Directory | Select-Object -First 1).FullName $env:FFMPEG_ROOT
          & "$env:FFMPEG_ROOT\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Test, build e autotest dell'eseguibile
        run: |
          $env:FFMPEG_DIR = "$env:FFMPEG_ROOT\bin"
          .\build.ps1 -Venv $env:VENV -DistDir $env:DIST -SelfTest "$PWD\tests\fixtures\speech_it.mp3"

      - name: Pacchetto zip
        id: package
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $app = "$env:DIST\MP3-to-LRC"
          Copy-Item LICENSE "$app\LICENSE.txt"
          Copy-Item "$env:FFMPEG_ROOT\LICENSE.txt" "$app\_internal\ffmpeg\LICENSE-ffmpeg.txt"
          $zip = "$env:RUNNER_TEMP\MP3-to-LRC-$version-windows-x64.zip"
          7z a -tzip -mx=5 $zip $app | Out-Null
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "Creato $zip ($([math]::Round((Get-Item $zip).Length / 1MB)) MB)"

      - name: Release (solo per i tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          body: |
            ## Download

            Scarica `MP3-to-LRC-${{ github.ref_name }}-windows-x64.zip`, estrai **l'intera cartella** e avvia `MP3-to-LRC.exe`.

            - Estrai in un percorso breve (es. `C:\MP3-to-LRC` o direttamente in Download): cartelle troppo profonde superano il limite di 260 caratteri di Windows.
            - Windows 10/11 a 64 bit, solo CPU (non serve Python).
            - I modelli Demucs e Whisper vengono scaricati al primo uso della modalità Locale: il primo avvio richiede internet.
            - Include FFmpeg in build LGPL ([BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds), sorgenti su [ffmpeg.org](https://ffmpeg.org/download.html)).

      - name: Artifact (avvio manuale)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MP3-to-LRC-windows-x64
          path: ${{ steps.package.outputs.zip }}
          compression-level: 0
          retention-days: 7
